[project]
name = "learning-helper"
dynamic = ["version"]
description = "Desafios periódicos na tela para impulsionar o aprendizado."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "customtkinter",
    "pillow",
    "screeninfo",
    "streamlit>=1.40",
]

[project.gui-scripts]
learning-helper = "learning_helper.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/learning_helper/__init__.py"

[dependency-groups]
dev = ["pyinstaller>=6.10", "pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
