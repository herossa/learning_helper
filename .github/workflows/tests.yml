name: tests

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Instalar dependências
        run: uv sync --frozen --group dev
      - name: Rodar testes
        run: uv run pytest -q
      - name: Empacotar wheel
        if: runner.os == 'Windows'
        run: uv build --wheel
      - name: Validar arquivos de dados no wheel
        if: runner.os == 'Windows'
        run: uv run python -c "import glob, zipfile; z = zipfile.ZipFile(glob.glob('dist/*.whl')[0]); names = z.namelist(); assert any(n.endswith('schema.sql') for n in names), names; assert any(n.endswith('banks/questions.json') for n in names), names; print('wheel ok')"
