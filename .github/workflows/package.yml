name: package

on:
  pull_request:
    paths:
      - "packaging/**"
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/package.yml"
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "packaging/**"
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/package.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Instalar Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Gerar executável e instalador
        run: powershell -NoProfile -ExecutionPolicy Bypass -File packaging/windows/build.ps1
      - name: Health check das estatísticas
        shell: pwsh
        run: |
          $exe = (Resolve-Path "dist/learning-helper/learning-helper.exe").Path
          $out = Join-Path $env:TEMP "stats-out.log"
          $err = Join-Path $env:TEMP "stats-err.log"
          $proc = Start-Process -FilePath $exe -ArgumentList "--stats-server", "--stats-port", "8599" -RedirectStandardOutput $out -RedirectStandardError $err -PassThru
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            try {
              $response = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:8599/_stcore/health" -TimeoutSec 1
              if ($response.StatusCode -eq 200) { $ok = $true; break }
            } catch {}
            Start-Sleep -Milliseconds 500
          }
          if (!$proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          if (-not $ok) {
            if (Test-Path $out) { Get-Content $out }
            if (Test-Path $err) { Get-Content $err }
            throw "health check do Streamlit falhou"
          }
      - name: Instalar, validar e desinstalar
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist/installer/*.exe | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-" -Wait
          $appDir = Join-Path $env:LOCALAPPDATA "Programs\LearningHelper"
          $app = Join-Path $appDir "learning-helper.exe"
          if (!(Test-Path $app)) { throw "aplicativo não encontrado em $appDir" }
          $check = Start-Process -FilePath $app -ArgumentList "--self-check" -Wait -PassThru
          if ($check.ExitCode -ne 0) { throw "self-check do aplicativo instalado falhou (exit $($check.ExitCode))" }

          $statsOut = Join-Path $env:TEMP "uninstall-stats-out.log"
          $statsErr = Join-Path $env:TEMP "uninstall-stats-err.log"
          $stats = Start-Process -FilePath $app -ArgumentList "--stats-server", "--stats-port", "8600" -RedirectStandardOutput $statsOut -RedirectStandardError $statsErr -PassThru
          Start-Sleep -Seconds 3
          if ($stats.HasExited) { throw "servidor de estatísticas não iniciou antes do teste" }

          $uninstaller = Get-ChildItem "$appDir\unins*.exe" | Select-Object -First 1
          Start-Process -FilePath $uninstaller.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          for ($i = 0; $i -lt 20 -and !$stats.HasExited; $i++) { Start-Sleep -Milliseconds 500 }
          if (!$stats.HasExited) {
            Stop-Process -Id $stats.Id -Force
            throw "desinstalador não encerrou o servidor de estatísticas"
          }
          for ($i = 0; $i -lt 15 -and (Test-Path $appDir); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $appDir) { throw "desinstalação deixou arquivos em $appDir" }
      - name: Guardar instalador
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/installer/*.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Instalar dependências
        run: uv sync --frozen --group dev
      - name: PyInstaller
        run: uv run pyinstaller packaging/learning-helper.spec --noconfirm
      - name: Self-check do binário
        run: ./dist/learning-helper/learning-helper --self-check
      - name: Health check das estatísticas
        run: |
          set -e
          ./dist/learning-helper/learning-helper --stats-server --stats-port 8599 > /tmp/stats.log 2>&1 &
          pid=$!
          ok=0
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8599/_stcore/health >/dev/null 2>&1; then
              ok=1
              break
            fi
            sleep 0.5
          done
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          if [ "$ok" != "1" ]; then
            cat /tmp/stats.log
            exit 1
          fi
      - name: Definir versão
        run: echo "VERSION=$(uv run python -c 'from learning_helper import __version__; print(__version__)')" >> "$GITHUB_ENV"
      - name: Baixar appimagetool
        run: |
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"
      - name: Gerar AppImage
        run: APPIMAGETOOL="$RUNNER_TEMP/appimagetool" APPIMAGETOOL_ARGS=--appimage-extract-and-run packaging/linux/build-appimage.sh "$VERSION"
      - name: Self-check do AppImage
        run: "./dist/LearningHelper-$VERSION-x86_64.AppImage --appimage-extract-and-run --self-check"
      - name: Gerar pacote por usuário
        run: packaging/linux/build-user-tarball.sh "$VERSION"
      - name: Testar instalador por usuário em Ubuntu limpo
        run: |
          docker run --rm \
            -v "$PWD/dist:/dist:ro" \
            -v "$PWD/packaging/linux/test-user-install.sh:/test.sh:ro" \
            ubuntu:22.04 bash -lc '
              set -e
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y -qq libx11-6 libxext6 libxrender1 libxft2 libfontconfig1 libfreetype6 procps >/dev/null
              bash /test.sh /dist/LearningHelper-*-linux-x86_64.tar.gz
            '
      - name: Guardar artefatos Linux
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/*.AppImage
            dist/*.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Baixar artefatos
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Conferir versão da tag
        run: |
          version=$(uv run python -c "from learning_helper import __version__; print(__version__)")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "Tag $tag não bate com __version__ $version" >&2
            exit 1
          fi
      - name: Gerar manifesto de atualização
        run: |
          version=$(uv run python -c "from learning_helper import __version__; print(__version__)")
          uv run python packaging/make_update_manifest.py \
            --version "$version" \
            --dist dist \
            --tag "$GITHUB_REF_NAME"
          uv run python -m json.tool dist/latest.json
      - name: Gerar checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Publicar release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
